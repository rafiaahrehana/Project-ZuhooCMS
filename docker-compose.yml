services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: businessflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Spring-boot/ZuhooCMS
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-ZLVZ9fU9c02Mi56OGmfsFZsKUEXeUwE8CDIwBHhyblM=}
      APP_FRONTEND_URL: http://localhost:4200
    volumes:
      - backend_uploads:/app/uploads
      - backend_assets:/app/assets
    ports:
      - "8085:8085"

  frontend:
    build:
      context: ./Angular/ZuhooCMS
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pg_data:
  backend_uploads:
  backend_assets:
