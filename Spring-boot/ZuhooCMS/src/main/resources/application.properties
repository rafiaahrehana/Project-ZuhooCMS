spring.application.name=ZuhooCMS

# Picks application-{profile}.properties; SPRING_PROFILES_ACTIVE overrides this at runtime.
spring.profiles.active=local

# Loads the gitignored .env as properties (see .env.example); real env vars win over it.
spring.config.import=optional:file:.env[.properties],optional:file:Spring-boot/ZuhooCMS/.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8085

# Binding-time cap for the endpoints that take a Pageable argument (Spring Data's own resolver clamps ?size= to this;
# its default is 2000). Kept equal to PaginationBoundsInterceptor.MAX_PAGE_SIZE, which bounds the same parameter for the
# many controllers that bind ?page=/?size= as plain @RequestParam ints. The interceptor bounds ?page= too - that is what
# stopped a huge page index from overflowing page * size into a 500.
spring.data.web.pageable.max-page-size=1000
spring.data.web.pageable.default-page-size=20

# The container's ERROR dispatch to /error is permitted in SecurityConfig so an exception that escapes the
# DispatcherServlet (one thrown from a servlet filter, before GlobalExceptionHandler can see it) reaches the caller
# with its real status instead of a misleading 401. Pinned off here so that page can never carry a stack trace or an
# exception message to the caller: devtools turns both ON in dev, and this path is reachable unauthenticated.
# Stack traces still go to the log, which is where they belong.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# swagger UI = http://localhost:8085/swagger-ui/index.html

image.upload.dir=./assets
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
# A 10MB file plus the multipart envelope and the "purpose" field must fit.
spring.servlet.multipart.max-request-size=11MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging the request thread when SMTP is unreachable/misconfigured.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


ai.default-provider=GEMINI
ai.default-model=GEMINI_2_5_FLASH
ai.global-timeout-ms=10000
ai.daily-company-limit=200
ai.hourly-user-limit=20
# Provider response (read) timeout; ai.global-timeout-ms above is the connect timeout.
ai.read-timeout-ms=60000
# Local testing only, never in production: force-mock routes every AI call to MOCK, mock-echo-prompt echoes the prompt back.
ai.force-mock=false
ai.mock-echo-prompt=false

ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.temperature=0.7
ai.gemini.max-tokens=2048

ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.temperature=0.7
ai.openai.max-tokens=2048

ai.claude.api-key=${CLAUDE_API_KEY:}
ai.claude.temperature=0.7
ai.claude.max-tokens=2048

# Groq (OpenAI-compatible API, free-tier friendly)
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.temperature=0.7
ai.groq.max-tokens=2048

# Required, env only (base64 of 32 bytes): encrypts the keys in ai_provider_configs - changing it makes saved keys undecryptable.
ai.key-encryption.secret=${AI_KEY_ENCRYPTION_SECRET:}

# Required, env only; never give it a default here - a committed signing key lets anyone mint tokens.
jwt.secret=${JWT_SECRET:}
# Access Token (15 minutes) - key must match JwtService's @Value binding
jwt.access-expiration-ms=900000

# Refresh Token (7 days)
jwt.refresh-expiration-ms=604800000

app.frontend-url=http://localhost:4200,http://localhost:*

# Path to a Firebase service-account JSON; unset just disables push, in-app STOMP notifications still work.
fcm.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Suppress warnings
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# bKash Gateway - credentials come from the environment only (env var or the local, gitignored .env)
bkash.app-key=${BKASH_APP_KEY:}
bkash.app-secret=${BKASH_APP_SECRET:}
bkash.username=${BKASH_USERNAME:}
bkash.password=${BKASH_PASSWORD:}
bkash.base-url=${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}

# Nagad Gateway - credentials come from the environment only (env var or the local, gitignored .env)
nagad.merchant-id=${NAGAD_MERCHANT_ID:}
nagad.public-key=${NAGAD_PUBLIC_KEY:}
nagad.private-key=${NAGAD_PRIVATE_KEY:}
nagad.base-url=${NAGAD_BASE_URL:https://sandbox.mynagad.com/remote-payment-gateway-1.0}

# Rocket Gateway - credentials come from the environment only (env var or the local, gitignored .env)
rocket.merchant-id=${ROCKET_MERCHANT_ID:}
rocket.password=${ROCKET_PASSWORD:}
rocket.base-url=${ROCKET_BASE_URL:https://developer.dutchbanglabank.com/api}


app.backend-url=http://localhost:8085
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
sslcommerz.sandbox=true
sslcommerz.currency=BDT

# Company that receives landing-page leads (tenant portals resolve by subdomain); empty = accept-and-drop with a log warning.
app.crm.platform-lead-company-id=

# Seeds a read-only demo tenant at startup and lets the landing page mint 45-minute sessions for it.
app.demo.enabled=true

# HMAC-SHA256 key for private-file links; unset means a random key per start, so links die on restart.
app.files.signing-key=${FILE_SIGNING_KEY:}
# Per-company storage quota (MB) and per-user upload rate limit.
app.files.company-quota-mb=2048
app.files.user-uploads-per-minute=30

# Unpaid service requests: reminder after 48h, automatic cancellation after 72h. The cancellation has no signed-in
# user, so its request_status_history row is stamped "System" (changed_by_id stays null).
app.servicerequest.payment.reminder-hours=48
app.servicerequest.payment.deadline-hours=72
app.servicerequest.payment.reminder-cron=0 0 * * * *
app.servicerequest.payment.cancel-cron=0 30 * * * *

# Daily job that disables self sign-ups whose owner never verified the email.
app.registration.cleanup.enabled=true
app.registration.cleanup.max-age-days=7
app.registration.cleanup.run-on-startup=false

# Time zone for dashboard "today"/period boundaries (blank = server default zone).
app.zone=

# Comma-separated proxy IPs whose X-Forwarded-For is trusted for client-IP resolution; empty = use the socket address.
app.security.trusted-proxies=

# Biometric fingerprint matching. No real matcher is integrated: the only implementation compares template STRINGS
# character by character, which is a replay test, not a biometric match. Left false, every verification request is
# refused; set true only for a local demo. See BiometricMatcher.
hrm.biometric.stub-matcher.enabled=false
