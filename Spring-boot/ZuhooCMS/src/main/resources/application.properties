spring.application.name=ZuhooCMS

# Which environment's overrides to load (application-{profile}.properties).
# SPRING_PROFILES_ACTIVE=docker in docker-compose.yml overrides this at runtime.
spring.profiles.active=local

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8085

# swagger UI = http://localhost:8085/swagger-ui/index.html

# Image Upload Directory
image.upload.dir=./assets
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast instead of hanging the request thread when SMTP is unreachable/misconfigured.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# AI Configuration
ai.default-provider=GEMINI
ai.default-model=GEMINI_2_5_FLASH
ai.global-timeout-ms=10000
ai.daily-company-limit=200
ai.hourly-user-limit=20

# Gemini
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.temperature=0.7
ai.gemini.max-tokens=2048

# OpenAI
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.temperature=0.7
ai.openai.max-tokens=2048

# Claude
ai.claude.api-key=${CLAUDE_API_KEY:}
ai.claude.temperature=0.7
ai.claude.max-tokens=2048

# Groq (OpenAI-compatible API, free-tier friendly)
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.temperature=0.7
ai.groq.max-tokens=2048

# AES-256-GCM key used to encrypt/decrypt tenant-supplied AI provider API keys
# (see AiKeyDecryptor) - must be a base64-encoded 256-bit key. Override via
# AI_KEY_ENCRYPTION_SECRET in every real deployment; this default is for local dev only.
ai.key-encryption.secret=${AI_KEY_ENCRYPTION_SECRET:ZLVZ9fU9c02Mi56OGmfsFZsKUEXeUwE8CDIwBHhyblM=}

# JWT and Frontend
jwt.secret=bHVzT3M3S3k4d1VhQlhuUXZtZjdkTkVqcFpzMlJpNlFGdFljV2VBb0doSXBLbERNbFZiMDkzNFhuVzY=
# Access Token (15 minutes) - key must match JwtService's @Value binding
jwt.access-expiration-ms=900000

# Refresh Token (7 days)
jwt.refresh-expiration-ms=604800000

app.frontend-url=http://localhost:4200

# Firebase Cloud Messaging - path to a service-account JSON from the Firebase console
# (Project settings -> Service accounts -> Generate new private key).
# Leave unset and push is simply disabled; the rest of the app runs normally and clients
# still get live in-app notifications over the STOMP socket.
fcm.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

# Suppress warnings
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


# bKash Gateway (sandbox/test values by default - override for real credentials)
bkash.app-key=${BKASH_APP_KEY:test_bkash_key}
bkash.app-secret=${BKASH_APP_SECRET:test_bkash_secret}
bkash.username=${BKASH_USERNAME:test_bkash_user}
bkash.password=${BKASH_PASSWORD:test_bkash_pass}
bkash.base-url=${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}

# Nagad Gateway (sandbox/test values by default - override for real credentials)
nagad.merchant-id=${NAGAD_MERCHANT_ID:test_nagad_merchant}
nagad.public-key=${NAGAD_PUBLIC_KEY:test_nagad_pub}
nagad.private-key=${NAGAD_PRIVATE_KEY:test_nagad_priv}
nagad.base-url=${NAGAD_BASE_URL:https://sandbox.mynagad.com/remote-payment-gateway-1.0}

# Rocket Gateway (sandbox/test values by default - override for real credentials)
rocket.merchant-id=${ROCKET_MERCHANT_ID:test_rocket_merchant}
rocket.password=${ROCKET_PASSWORD:test_rocket_pass}
rocket.base-url=${ROCKET_BASE_URL:https://developer.dutchbanglabank.com/api}


app.backend-url=http://localhost:8085
sslcommerz.store-id=lumin69ff21529bc58
sslcommerz.store-password=lumin69ff21529bc58@ssl
sslcommerz.sandbox=true
sslcommerz.currency=BDT

# Which company receives leads captured from the platform landing page (tenant
# portals resolve by subdomain instead). Leave empty to accept-and-drop with a
# warning in the log; set after the production companies exist.
app.crm.platform-lead-company-id=

# Public product demo: seeds a read-only demo tenant at startup and lets the
# landing page "See Demo" button mint 45-minute sessions for it.
app.demo.enabled=true
