@if (visible) {
<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,.4)">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ title }}</h5>
        <button type="button" class="btn-close" (click)="cancelled.emit()"></button>
      </div>
      <div class="modal-body"><p class="mb-0">{{ message }}</p></div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" (click)="cancelled.emit()">Cancel</button>
        <button class="btn btn-sm" [class.btn-danger]="danger" [class.btn-primary]="!danger"
                (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
</div>
}
