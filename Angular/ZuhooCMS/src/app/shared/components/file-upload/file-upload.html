<div>
  <label class="form-label small text-muted mb-1">{{ label }}</label>
  <input class="form-control form-control-sm" type="file" [accept]="accept" [disabled]="uploading" (change)="onFileSelected($event)" />
  @if (uploading) { <div class="small text-muted mt-1"><span class="spinner-border spinner-border-sm me-1"></span>Uploading...</div> }
  @if (error) { <div class="small text-danger mt-1">{{ error }}</div> }
  @if (lastResult && !uploading) {
  <div class="small text-success mt-1"><i class="bi bi-check-circle me-1"></i>{{ lastResult.fileName }} uploaded</div>
  }
</div>
