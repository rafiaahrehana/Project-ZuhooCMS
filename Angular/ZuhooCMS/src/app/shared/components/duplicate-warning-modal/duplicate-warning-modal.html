@if (match) {
<div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,.4)">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title fs-6 fw-semibold">
          <i class="bi bi-exclamation-triangle-fill text-warning me-1"></i>Possible duplicate found
        </h5>
        <button type="button" class="btn-close" (click)="dismissed.emit()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-1">This record looks similar to an existing client:</p>
        <div class="border rounded-3 p-2 bg-light">
          <div class="fw-semibold">{{ match.clientCompanyName }}</div>
          <div class="text-muted small">Matched on {{ matchedOnLabel() }}</div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-secondary btn-sm" (click)="dismissed.emit()">Dismiss</button>
        <a class="btn btn-primary btn-sm" [routerLink]="['/crm/clients', match.clientId]" (click)="dismissed.emit()">
          View Existing Client
        </a>
      </div>
    </div>
  </div>
</div>
}
