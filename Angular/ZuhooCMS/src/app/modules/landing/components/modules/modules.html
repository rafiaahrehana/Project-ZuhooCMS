<section id="modules" class="accent-section-charcoal py-5 position-relative overflow-hidden">
  <div class="container py-5 position-relative">
    <div class="row mb-4">
      <div class="col-lg-8 mx-auto text-center">
        <span class="eyebrow-badge on-dark fade-in mb-3 d-inline-flex"><span class="eyebrow-dot"></span>ZuhooCMS</span>
        <h2 class="display-5 fw-bold section-title mb-3 slide-up">All-in-One Business Platform</h2>
        <p class="lead section-sub slide-up mx-auto">12+ powerful modules orbiting one core - every operation, one platform.</p>
      </div>
    </div>

    <!-- The radial. Rings rotate like the hero's orbits; every chip
         counter-rotates so its label stays upright. Decorative motion only,
         so the whole diagram is aria-hidden and the chip grid below (shown on
         phones, present in the DOM everywhere) carries the content. -->
    <div class="radial d-none d-md-flex mx-auto" aria-hidden="true">
      <div class="radial-hub">
        <i class="bi bi-cpu"></i>
        <span>Core<br />Platform</span>
      </div>

      <div class="radial-ring ring-outer">
        @for (m of outer(); track m.title) {
          <div class="mod-holder" [style.--a]="m.angle + 'deg'" [style.--r]="'var(--outer-r)'">
            <div class="mod-chip" [ngClass]="'accent-' + m.accent">
              <i class="bi" [ngClass]="m.icon"></i>{{ m.title }}
            </div>
          </div>
        }
      </div>

      <div class="radial-ring ring-inner">
        @for (m of inner(); track m.title) {
          <div class="mod-holder" [style.--a]="m.angle + 'deg'" [style.--r]="'var(--inner-r)'">
            <div class="mod-chip" [ngClass]="'accent-' + m.accent">
              <i class="bi" [ngClass]="m.icon"></i>{{ m.title }}
            </div>
          </div>
        }
      </div>
    </div>

    <!-- Phones get a compact chip grid; it is also the accessible version
         of the diagram, so it stays in the DOM at every size. -->
    <div class="row g-2 justify-content-center mod-grid d-md-none">
      @for (m of modulesList(); track m.title) {
        <div class="col-auto">
          <div class="mod-chip static" [ngClass]="'accent-' + m.accent" [title]="m.desc">
            <i class="bi" [ngClass]="m.icon"></i>{{ m.title }}
          </div>
        </div>
      }
    </div>
  </div>
</section>
